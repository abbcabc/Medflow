server:
  port: 1219

# Pinecone 向量库：从环境变量 PINECONE_API_KEY 读取，未设置时为空（应用启动后调用向量库会报错）
# 密钥不写入本文件；如需轮换，到 Pinecone 控制台生成新密钥后更新环境变量即可
pinecone:
  api-key: ${PINECONE_API_KEY:}

# ??????
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen3-max
      # ??????-v3
      embedding-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: text-embedding-v3
      # ??????
      streaming-chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-plus

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
    web:
      resources:
        static-locations: classpath:/static/
  data:
    mongodb:
      uri: mongodb://localhost:27017/medflow_memory_db
  datasource:
    url: jdbc:mysql://localhost:3306/medflowdb?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # SQL ????
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true  # 开启驼峰下划线自动映射

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.medflow.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
